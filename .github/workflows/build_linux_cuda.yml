name: build_simgears_cpplinux_cuda
run-name: Build and test SimulationGears native CUDA library

on:
  workflow_dispatch:
    inputs:
      enable_optix:
        description: "Enable OptiX (requires SDK on runner)"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      enable_tbb:
        description: "Enable oneTBB (requires TBB on runner)"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: cuda-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ vars.CI_USE_SELF_HOSTED == 'true' }}
    runs-on: [self-hosted, Linux, X64, gpu, cuda]
    timeout-minutes: 90
    env:
      BUILD_DIR: build_cuda_ci
      BUILD_TYPE: RelWithDebInfo
      ENABLE_OPTIX: ${{ github.event.inputs.enable_optix == 'true' && 'ON' || 'OFF' }}
      ENABLE_TBB: ${{ github.event.inputs.enable_tbb == 'true' && 'ON' || 'OFF' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate CUDA prerequisites
        run: |
          command -v cmake
          command -v ninja
          command -v g++
          command -v ccache
          command -v nvcc
          command -v nvidia-smi
          python3 -m pytest --version
          python3 -c 'import yaml'
          nvidia-smi
          nvcc --version

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-simgears-cuda-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**', 'tests/**') }}
          restore-keys: |
            ccache-simgears-cuda-${{ runner.os }}-${{ github.ref_name }}-
            ccache-simgears-cuda-${{ runner.os }}-

      - name: Configure
        run: |
          cmake -S . -B "${BUILD_DIR}" -GNinja \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DENABLE_TESTS=ON \
            -DENABLE_PYTHON_TESTS=ON \
            -DENABLE_SUBMODULES=OFF \
            -DENABLE_CUDA=ON \
            -DENABLE_OPTIX="${ENABLE_OPTIX}" \
            -DENABLE_TBB="${ENABLE_TBB}" \
            -DENABLE_OPENGL=OFF \
            -DENABLE_FETCH_CATCH2=ON \
            -DCPU_ENABLE_NATIVE_TUNING=OFF \
            -DCUDA_ENABLE_FMAD=ON \
            -DCUDA_ENABLE_EXTRA_DEVICE_VECTORIZATION=ON \
            -DSimulationGears_for_SpaceNav_BUILD_PROGRAMS=OFF \
            -DSimulationGears_for_SpaceNav_BUILD_EXAMPLES=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build "${BUILD_DIR}" --parallel 4

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: simulation-gears-cuda-build
          path: ${{ env.BUILD_DIR }}
          if-no-files-found: error
          retention-days: 3

  test:
    needs: build
    if: ${{ vars.CI_USE_SELF_HOSTED == 'true' }}
    runs-on: [self-hosted, Linux, X64, gpu, cuda]
    timeout-minutes: 45
    env:
      BUILD_DIR: build_cuda_ci
      CTEST_OUTPUT_ON_FAILURE: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate CUDA test prerequisites
        run: |
          command -v ctest
          command -v nvidia-smi
          python3 -m pytest --version
          python3 -c 'import yaml'
          nvidia-smi

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: simulation-gears-cuda-build
          path: ${{ env.BUILD_DIR }}

      - name: Resolve downloaded build tree
        run: |
          if [ -d "${BUILD_DIR}/CMakeFiles" ]; then
            echo "CTEST_DIR=${BUILD_DIR}" >> "$GITHUB_ENV"
          elif [ -d "${BUILD_DIR}/${BUILD_DIR}/CMakeFiles" ]; then
            echo "CTEST_DIR=${BUILD_DIR}/${BUILD_DIR}" >> "$GITHUB_ENV"
          else
            find "${BUILD_DIR}" -maxdepth 3 -type d | sort || true
            exit 1
          fi

      - name: Restore test executable permissions
        run: find "${CTEST_DIR}" -type f -path "*/tests/*" -exec chmod +x {} + || true

      - name: Test
        run: ctest --test-dir "${CTEST_DIR}" --output-on-failure --parallel 2 --no-tests=error
