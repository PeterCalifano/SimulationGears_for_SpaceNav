name: build_simgears_cpplinux
run-name: Build and test SimulationGears native CPU library

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner type to use"
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - self-hosted
  push:
    branches:
      - "master"
      - "main"
      - "develop"
    tags:
      - "v*.*.*"
    paths:
      - src/**
      - examples/**
      - tests/**
      - lib/**
      - cmake/**
      - doc/**
      - CMakeLists.txt
      - CMakePresets.json
      - build_lib.sh
      - generate_version.sh
      - .github/workflows/build_linux.yml
  pull_request:
    branches:
      - "master"
      - "main"
      - "develop"
      - "dev*"
    paths:
      - src/**
      - examples/**
      - tests/**
      - lib/**
      - cmake/**
      - doc/**
      - CMakeLists.txt
      - CMakePresets.json
      - build_lib.sh
      - generate_version.sh
      - .github/workflows/build_linux.yml

jobs:
  # Reuse the runner's build tree so CTest needs no artifact transfer.
  build-and-test:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'self-hosted' && fromJSON('["self-hosted","Linux","X64"]') || 'ubuntu-latest' }}
    env:
      BUILD_DIR: build_ci
      BUILD_TYPE: RelWithDebInfo
      ENABLE_TBB: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'self-hosted' && 'OFF' || 'ON' }}
      CTEST_OUTPUT_ON_FAILURE: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.runner == 'github-hosted' }}
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build g++ ccache libeigen3-dev libtbb-dev python3-dev python3-pytest python3-yaml

      - name: Validate self-hosted prerequisites
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'self-hosted' }}
        run: |
          command -v cmake
          command -v ctest
          command -v ninja
          command -v g++
          command -v ccache
          command -v python3
          python3 -m pytest --version
          python3 -c 'import yaml'

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-simgears-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**', 'tests/**') }}
          restore-keys: |
            ccache-simgears-${{ runner.os }}-${{ github.ref_name }}-
            ccache-simgears-${{ runner.os }}-

      - name: Configure
        run: |
          cmake -S . -B "${BUILD_DIR}" -GNinja \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DENABLE_TESTS=ON \
            -DENABLE_PYTHON_TESTS=ON \
            -DENABLE_SUBMODULES=OFF \
            -DENABLE_TBB="${ENABLE_TBB}" \
            -DENABLE_CUDA=OFF \
            -DENABLE_OPTIX=OFF \
            -DENABLE_OPENGL=OFF \
            -DENABLE_FETCH_CATCH2=ON \
            -DCPU_ENABLE_NATIVE_TUNING=OFF \
            -Dsim_gears_for_space_nav_BUILD_PROGRAMS=OFF \
            -Dsim_gears_for_space_nav_BUILD_EXAMPLES=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build "${BUILD_DIR}" --parallel 4

      - name: Show ccache stats
        run: ccache --show-stats || true

      - name: Test
        run: ctest --test-dir "${BUILD_DIR}" --output-on-failure --parallel 2 --no-tests=error
